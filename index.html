<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F0F1E">
  <title>NEXUS COCKPIT · 三域智能诊断工作台</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem('nexus-cockpit-theme') === 'light' ? 'light' : 'dark';
    } catch (error) { /* optional */ }
  </script>
  <link rel="stylesheet" href="styles.css?v=20261028e">
</head>
<body>
  <div class="app-frame">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <path d="M16 3 28 10v12L16 29 4 22V10L16 3Z" fill="none" stroke="currentColor" stroke-width="1.4"/>
            <path d="M11 21V11l10 10V11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-copy">
          <div class="brand-name">NEXUS <span>COCKPIT</span></div>
          <div class="brand-sub">CDC / MDC / VDC · INTELLIGENT DIAGNOSTIC</div>
        </div>
      </div>

      <div class="header-status">
        <span class="header-chip live"><i class="live-dot"></i>车辆在线</span>
        <span class="vehicle-label">NEXUS E7 · CDC / MDC / VDC</span>
        <span class="header-divider"></span>
        <span class="header-chip scan-chip" id="scanChip">
          <svg class="icon" aria-hidden="true"><use href="#i-scan"></use></svg>
          <span id="scanChipText">日志待扫描</span>
        </span>
        <span class="fps-chip"><i></i><b id="fpsValue">30</b> FPS</span>
      </div>

      <div class="header-actions">
        <button class="btn subtle" id="logImportBtn" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-upload"></use></svg>
          <span>导入日志</span>
        </button>
        <button class="btn subtle" id="rescanBtn" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-refresh"></use></svg>
          <span>重新扫描</span>
        </button>
        <button class="btn primary" id="exportBtn" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-download"></use></svg>
          <span>导出 8D 报告</span>
        </button>
        <button class="icon-btn" id="themeToggle" type="button" aria-label="切换白色主题" title="切换主题">
          <svg class="icon theme-icon-dark" aria-hidden="true"><use href="#i-moon"></use></svg>
          <svg class="icon theme-icon-light" aria-hidden="true"><use href="#i-sun"></use></svg>
        </button>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <div class="sidebar-head">
          <span>诊断导航</span>
          <span class="sidebar-meta" id="sidebarModuleMeta">23 MODULES</span>
        </div>
        <div class="domain-switch" id="domainSwitch"></div>
        <nav class="module-nav" id="moduleNav" aria-label="诊断模块导航"></nav>
        <div class="sidebar-source" id="sidebarSource"></div>
        <div class="sidebar-foot">
          <span class="live-dot"></span>
          <span>日志解析器 v2.4</span>
          <span class="sidebar-build">CDC-OS</span>
        </div>
      </aside>

      <main class="main-content" id="mainContent" tabindex="-1"></main>
    </div>
  </div>

  <div class="modal-layer" id="modalRoot" aria-hidden="true"></div>
  <div class="toast-stack" id="toastRoot" role="status" aria-live="polite"></div>

  <svg xmlns="http://www.w3.org/2000/svg" class="icon-sprite" aria-hidden="true">
